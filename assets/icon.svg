<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="glow" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#1E6B45" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#14231B" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0C1210" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E6B45"/>
      <stop offset="60%" stop-color="#2F9E63"/>
      <stop offset="100%" stop-color="#7FD6A4"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="#0C1210"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <!-- faint grid -->
  <g stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="2">
    <line x1="0" y1="256" x2="1024" y2="256"/>
    <line x1="0" y1="512" x2="1024" y2="512"/>
    <line x1="0" y1="768" x2="1024" y2="768"/>
    <line x1="256" y1="0" x2="256" y2="1024"/>
    <line x1="512" y1="0" x2="512" y2="1024"/>
    <line x1="768" y1="0" x2="768" y2="1024"/>
  </g>
  <!-- growth line -->
  <polyline
    points="212,724 372,604 512,648 664,452 796,326"
    fill="none"
    stroke="url(#line)"
    stroke-width="68"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- diamond node -->
  <g transform="translate(796,326)">
    <polygon points="0,-78 62,0 0,78 -62,0" fill="#7FD6A4"/>
    <polygon points="0,-78 62,0 0,0 -62,0" fill="#FFFFFF" fill-opacity="0.25"/>
  </g>
  <!-- origin dot -->
  <circle cx="212" cy="724" r="26" fill="#1E6B45"/>
</svg>
